            <li class="nav-item">

            </li>
            <li class="nav-item">
                <a class="nav-link" style="background-color: blue; color: white; margin: 0 10px; border-radius: 8px; " href="https://localhost:7253/views/cuenta/mi_cuenta.html">Mi cuenta</a>

            </li>
           
            <li class="nav-item">
                <a class="nav-link" style="background-color: rgb(4, 4, 117); color: white; margin:0 10px;" href="https://localhost:7253/views/cuenta/crear_cuenta.html">Crear cuenta</a>
            </li>
        </ul>
    </nav>

    <!-- tarjetas -->

    <center>
        <div class="container col-md-4 col-sm-6">

            <div class="card" style="width: 20rem; margin-top: 25vh; margin: 25% auto; background-color: rgb(7, 33, 69); color: white; ">
                <div class="card-body" style="display: grid; justify-content: center; align-items: center;">

                    <h5 class=" nombre card-title">Nombre:</h5>
                    <Input id="txtNombre" type="text" style="background-color: rgb(3, 133, 135); font-family: Roboto, sans-serif, Arial; font-weight: bold; align-items:center;" ></Input>
                    <style>
                        #txtNombre {
                            background-color: rgb(3, 133, 135);
                            border: none; /* Quitar el borde */
                            outline: none; /* Quitar el borde al hacer clic */
                        }
                    </style>
                    <h5 class=" user card-title">Usuario:</h5>
                    <Input id="txtUsuario" type="text" style="background-color: rgb(3, 133, 135); font-weight: bold;"></Input>
                    <style>
                        #txtUsuario {
                            background-color: rgb(3, 133, 135);
                            border: none; /* Quitar el borde */
                            outline: none; /* Quitar el borde al hacer clic */
                        }
                    </style>
                    <h5 class=" contraseña card-title">Contraseña:</h5>
                    <Input id="txtContraseña" type="text" style="background-color: rgb(3, 133, 135); font-weight: bold;"></Input>
                    <style>
                        #txtContraseña {
                            background-color: rgb(3, 133, 135);
                            border: none; /* Quitar el borde */
                            outline: none; /* Quitar el borde al hacer clic */
                        }
                    </style>
                    <br>

                    <div class="container">
                        <button type="button" class="btn-primary" style="background-color: rgb(4, 111, 212); color: white; justify-items: center; border-style: none; border-radius: 45vh;">   Deshabilitar   </button>
                        <button type="button" class="btn-primary" style="background-color: rgb(4, 111, 212); color: white; justify-items: center; border-style: none; border-radius: 45vh;">   Editar   </button>
                        <button type="button" class="btn-primary" style="background-color: rgb(4, 111, 212); color: white; justify-items: center; border-style: none; border-radius: 45vh;">   Guardar   </button>
                        <center>
                            <br>
                            <a href="https://localhost:7253/views/sin-cuenta/iniciosesion.html">
                                <button type="button" id="btnCrear_cuenta" name="btnCrear_cuenta" class="btn-primary" style="background-color: rgb(4, 111, 212); border-style: none; border-radius: 45vh; color: white; justify-items: center;">   Cerrar sesion    </button>
                            </a>
                        </center>

                    </div>
                </div>
            </div>
        </div>
        </center>


            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
