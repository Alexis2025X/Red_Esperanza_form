                <div class="card-body" style="display: grid; justify-content: center; align-items: center;">

                    <h5 class=" nombre card-title">Ingrese su nombre:</h5>
                    <Input type="text" maxlength="75" style="background-color: rgb(3, 133, 135); font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: black; text-align: center;" id="txtNombreCuenta" name="txtNombreCuenta">
                    <style>
                        /* Estilo para quitar el borde del input */

                            background-color: rgb(3, 133, 135);

                        }
                    </style>

                    <h5 class=" user card-title">Cree un usuario:</h5>
                    <Input type="text" maxlength="75" style="background-color: rgb(3, 133, 135); font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: black; text-align: center;" id="txtUsuarioCuenta" name="txtUsuarioCuenta">
                    <style>
                        /* Estilo para quitar el borde del input */

                        }
                    </style>
                    <h5 class=" contraseña card-title">Cree una contraseña:</h5>

                    <br>

                    <button type="button" id="btnCrear_cuenta" name="btnCrear_cuenta" class="btn-primary" style="background-color: rgb(4, 111, 212); border-style: none; border-radius: 45vh; color: white; justify-items: center;">   Crear   </button>

            <!-- JavaScript -->
            <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>


            <script>
                const crear = document.getElementById("btnCrear_cuenta");

                crear.addEventListener("click", guardarCuenta);

                var url;

                async function guardarCuenta() {
                    console.log("Comienzo");
                    let datos = {
                        nombre: txtNombreCuenta.value,
                        usuario: txtUsuarioCuenta.value,
                        contraseña: txtContraseñaCuenta.value,
                    },
                        method = "POST",
                        url = "https://localhost:7253/api/cuentas"
                    /*                const respuesta = await fetch(url, {
                                    method,
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify(datos),
                                }), crear_cuenta = await respuesta.json()*/
                    try {
                        const respuesta = await fetch(url, {
                            method,
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(datos)
                        });

                        if (!respuesta.ok) {
                            throw new Error('Error en la solicitud');

                        }
                        else {
                            alertify.success("Su cuenta ha sido creada");
                        }

                        //const jsonRespuesta = await respuesta.json();
                        // Procesar la respuesta del servidor
                    } catch (error) {
                        console.error('Error al crear la cuenta:', error);
                    }
                    limpieza();

                    /*try {
                        const respuesta = await fetch(url, {
                            method,
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(datos)
                        });

                        if (!respuesta.ok) {
                            throw new Error('Error en la solicitud');

                        }

                        const jsonRespuesta = await respuesta.json();
                        // Procesar la respuesta del servidor
                    } catch (error) {
                        console.error('Error al crear la cuenta:', error);
                    }
                    limpieza();*/
                }

                function limpieza() {
                    txtUsuarioCuenta.value = "";
                    txtNombreCuenta.value = "";
                    txtContraseñaCuenta.value = "";
                }
            </script>
