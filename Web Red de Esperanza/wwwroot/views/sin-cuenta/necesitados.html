<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!--Font Family proveniente de google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body class="m-0 border-0 bd-example m-0 border-0" style="background-color: #015a95; font-family: Roboto, sans-serif, Arial; min-width: 326px">

    <nav class="navbar justify-content-center" data-bs-theme="White" style="background-color: rgb(4, 4, 117);">
        <ul class="nav justify-content-center menu-nav" style="background-color: rgb(4, 4, 117);">
            <li class="nav-item">
                <a class="nav-link" style="background-color:rgb(4, 4, 117); color: white; margin:0 10px;" href="https://localhost:7253/views/sin-cuenta/desaparecidos.html">Desaparecidos</a>

            </li>
            <li class="nav-item">
                <a class="nav-link" style="background-color: blue; color: white; margin: 0 10px; border-radius: 8px;" href="https://localhost:7253/views/sin-cuenta/necesitados.html">Necesitados</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" style="background-color: rgb(4, 4, 117); color: white; margin:0 10px;" href="https://localhost:7253/views/sin-cuenta/iniciosesion.html">Acceder</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" style="background-color: rgb(4, 4, 117); color: rgb(125, 138, 158); margin: 0 10px;">Mis anuncios</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" style="background-color: rgb(4, 4, 117); color: white; margin:0 10px;" href="https://localhost:7253/views/sin-cuenta/crear_cuenta.html">Crear cuenta</a>
            </li>
            <li class="nav-item">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar necesitado" aria-label="Search" id="txtBuscar">
                    <button class="btn btn-outline-success" type="submit" style="background-color: blue; color: white;" id="btnBuscar">Limpiar</button>
                </form>
            </li>
        </ul>
    </nav>
    <style>
        #btnBuscar {
            border: none;
        }

        #txtBuscar {
            border: none;
        }
    </style>
    <!-- tarjetas -->

    <div class="row m-0 border-0 bd-example m-0 border-0 justify-content-center" id="bodyNecesitados"></div>

    <script>
        //AGREGAR AL OTRO ARCHIVO
        txtBuscar.addEventListener('keyup', e => {
            mostrarNecesitados(txtBuscar.value);
        });
        //------
        let bodyNecesitados = document.getElementById("bodyNecesitados");
        let btnBuscar = document.querySelector("#btnBuscar");
        //btnBuscar.addEventListener("click", buscarNecesitados);

        mostrarNecesitados();

        async function mostrarNecesitados(buscar = '') {
            
            let url = `/api/Necesitados/${buscar}`
            //AGREGAR AL OTRO ARCHIVO
            
            bodyNecesitados.innerHTML = '';
            const respuesta = await fetch(url, //------------
                {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json"
                    }
                }), necesitados = await respuesta.json();
            const localidades = [
                'Ahuachapan Sur',
                'San Salvador Norte',
                'San Salvador Oeste',
                'San Salvador Este',
                'San Salvador Centro',
                'San Salvador Sur',
                'La Libertad Norte',
                'La Libertad Centro',
                'La Libertad Oeste',
                'La Libertad Este',
                'La Libertad Costa',
                'La Libertad Sur',
                'Chalatenango Norte',
                'Chalatenango Centro',
                'Sonsonate Norte',
                'Sonsonate Oeste',
                'Sonsonate Centro',
                'Sonsonate Este',
                'Cabañas Este',
                'Morazán Sur',
                'La Union Norte',
                'La Union Sur',
                'San Miguel Centro',
                'San Miguel Norte',
                'San Miguel Oeste'
            ];
            const ayudasCiudadanas = [
                'Bono de Alimentos',
                'Subsidio de Vivienda',
                'Beca Educativa',
                'Programa de Empleo Temporal',
                'Asistencia Médica Gratuita',
                'Subsidio de Transporte',
                'Programa de Capacitación Laboral',
                'Ayuda a Víctimas de Violencia',
                'Fondo de Emergencia',
                'Programa de Inclusión Social'
            ];


            necesitados.forEach(necesitados => {


                
                let fecha_publicacion = necesitados.fecha_publicacion;
                const fechaOriginal = fecha_publicacion;

                const fechaFormateada = new Date(fechaOriginal).toISOString().split('T')[0].split("-").reverse().join("/");

                bodyNecesitados.innerHTML += `
  <div class="col-sm-6 col-md-4 "  style=" margin-left:20px; margin-right:20px">
    <div class="card" style="width: 18rem; background-color: #072145; color: white; margin: 0.5rem auto;">
        <img src="data:image/png;base64,${necesitados.imagen}"class="img - thumbnail rounded"/>
        <div class="card-body">
                <h5 class="card-title" style="background-color: #038587; color: white;">Ayudemos a: <br>
                ${necesitados.nombre_nece} ${necesitados.apellido}</h5>
        
             <p><strong>Edad:</strong> ${necesitados.edad}</p>
             <p><strong>Distrito:</strong> ${localidades[parseInt(necesitados.distrito_id) - 1]}</p>
             <p><strong>Ubicación: </strong>${necesitados.direccion}  </p>
             <p><strong>Descripcion:</strong> <br></p>
             <p class="card-text">${necesitados.situacion_descripcion}</p>
             <p><strong>Ayuda con:</strong> ${ayudasCiudadanas[parseInt(necesitados.ayuda_id) - 1]}</p>
             <p><strong>Si quiere ayudar a esta persona puede contactarlos por medio de:</strong><p>
             <p><strong>Teléfono:</strong> ${necesitados.telefono}  </p>
              <p><strong>WhatsApp: </strong>${necesitados.whatsApp}</p>
             <p><strong>Creacion del anuncio: </strong><br> ${fechaFormateada}</p>
             <p><strong>Publicado por: </strong> ${necesitados.cuenta.usuario} <br></p>
        </div>
    </div>
</div>` 


            });
        }

 


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
