    <style>
        #btnBuscar {
            border: none;
        }

        #txtBuscar {
            border: none;
        }
    </style>
    <!-- tarjetas -->

    <div class="row m-0 border-0 bd-example m-0 border-0 justify-content-center" id="bodyDesaparecidos"></div>

        <script>
            //AGREGAR AL OTRO ARCHIVO
            txtBuscar.addEventListener('keyup', e => {
                mostrarDesaparecidos(txtBuscar.value);
            });
            //------
            let bodyDesaparecidos = document.getElementById("bodyDesaparecidos");
            let btnBuscar = document.querySelector("#btnBuscar");
            //btnBuscar.addEventListener("click", buscarDesaparecido);

            mostrarDesaparecidos();

            async function mostrarDesaparecidos(buscar = '') {
                /*console.log(buscar)*/
                let url = `/api/Desaparecidos/${buscar}`
                //AGREGAR AL OTRO ARCHIVO
               
                bodyDesaparecidos.innerHTML = '';
                const respuesta = await fetch(url, {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json"
                    }
                }), Desaparecidos = await respuesta.json();
                const localidades = [
                    'Ahuachapan Sur',
                    'San Salvador Norte',
                    'San Salvador Oeste',
                    'San Salvador Este',
                    'San Salvador Centro',
                    'San Salvador Sur',
                    'La Libertad Norte',
                    'La Libertad Centro',
                    'La Libertad Oeste',
                    'La Libertad Este',
                    'La Libertad Costa',
                    'La Libertad Sur',
                    'Chalatenango Norte',
                    'Chalatenango Centro',
                    'Sonsonate Norte',
                    'Sonsonate Oeste',
                    'Sonsonate Centro',
                    'Sonsonate Este',
                    'Cabañas Este',
                    'Morazán Sur',
                    'La Union Norte',
                    'La Union Sur',
                    'San Miguel Centro',
                    'San Miguel Norte',
                    'San Miguel Oeste'
                ];
               

                
                Desaparecidos.forEach(Desaparecidos => {

                    
                    let fecha_publicacion = Desaparecidos.fecha_publicacion;
                    const fechaOriginal = fecha_publicacion;

                    const fechaFormateada = new Date(fechaOriginal).toISOString().split('T')[0].split("-").reverse().join("/");

                    let fecha = Desaparecidos.fecha_Desaparicion;

                    const Fecha_desaparicion = fecha;

                    const fecha_desaparicion_Formateada = new Date(Fecha_desaparicion).toISOString().split('T')[0].split("-").reverse().join("/");

                    bodyDesaparecidos.innerHTML += `
                    <!--PONERLON EN LOS DEMÁS-->
                  <div class="col-sm-6 col-md-4 "  style=" margin-left:20px; margin-right:20px">
                  <div class="card" style="width: 18rem; background-color: #072145; color: white; margin: 0.5rem auto;">
                   <img src="data:image/png;base64,${Desaparecidos.imagen}"class="img - thumbnail rounded"/>
                  <div class="card-body">
                  <h5 class="card-title" style="background-color: #038587; color: white;">
                  Ayudenos a encontrar a: ${Desaparecidos.nombre} ${Desaparecidos.apellido} </h5>
                  <p><strong>Edad:</strong> ${Desaparecidos.edad}</p>
                  <p><strong>Distrito al que pertenece: </strong>${localidades[parseInt(Desaparecidos.distrito_id) - 1]} </p>
                  <p class="list-group-item" style="background-color: #072145; color: white;">
                  <strong>Fecha de desaparición:</strong> ${fecha_desaparicion_Formateada}</p>
                  <p class="list-group-item" style="background-color: #072145; color: white;">
                  <strong>Visto por ultima vez en: </strong> ${Desaparecidos.lugar_Desaparicion}</p>
                  <p><strong>Características físicas: </strong></p>
                  <p class="card-text"> ${Desaparecidos.descripción_persona}</p>
                  <p><strong>Si sabe algo contactelos por medio de:</strong><p>
                  <p><strong>Telefono:</strong> ${Desaparecidos.telefono} </p>
                  <p><strong>WhatsApp: </strong> ${Desaparecidos.whatsApp} </p>
                  <p><strong>Publicado por:</strong> ${Desaparecidos.cuenta.usuario}</p>              
            </div>
      </div>
</div>`});
            }
        </script>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
